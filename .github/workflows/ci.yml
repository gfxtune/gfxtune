# Every change is built and tested on CachyOS, in the official container
# image, with the same scripts contributors run (see CONTRIBUTING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Licences and formatting
    runs-on: ubuntu-latest
    container: cachyos/cachyos-v3:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci/provision.sh checks
      - run: ci/build.sh checks

  tidy:
    name: Clang build and clang-tidy
    runs-on: ubuntu-latest
    container: cachyos/cachyos-v3:latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci/provision.sh build checks
      - run: ci/build.sh tidy

  build:
    name: Build and test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    container: cachyos/cachyos-v3:latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, asan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci/provision.sh build tests
      - run: ci/build.sh ${{ matrix.mode }}
      - if: matrix.mode == 'debug'
        run: ci/build.sh lint

  system:
    name: Package and system tests
    runs-on: ubuntu-latest
    container: cachyos/cachyos-v3:latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci/provision.sh build tests games
      - run: ci/system-tests.sh -v
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-test-logs
          # The games' logs and what gfxtune-run and the layer reported.
          path: |
            /tmp/pytest-of-builder/**/*.log
            /tmp/pytest-of-builder/**/last-launch/*
          retention-days: 7
