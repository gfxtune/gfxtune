name: Feature request
description: A setting, reading or behaviour gfxtune should have.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: What it should do, and for which games or cards.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would let you do that you cannot now, and how you do it today, if at all.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it could work
      description: Optional. The Mesa, DXVK, Proton or gamescope option behind it, if you know one.
